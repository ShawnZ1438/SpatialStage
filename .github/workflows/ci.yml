name: SpatialStage regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audio library prerequisites
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libsndfile1
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Python correctness lint
        run: python -m ruff check stagespatialcue tests
      - name: Python regression tests (simulated hardware)
        run: python -m pytest -q
      - name: JavaScript syntax and save-race regressions
        run: |
          node --check stagespatialcue/static/app.js
          node --check stagespatialcue/static/save-queue.js
          node --check stagespatialcue/static/simulation.js
          node --check stagespatialcue/static/stage-map.js
          node --check stagespatialcue/static/editor.js
          node --check stagespatialcue/static/i18n.js
          node --check stagespatialcue/static/theme.js
          node --test tests/js/*.test.cjs
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2 libsndfile1
      - run: python -m pip install -e '.[dev]'
      - run: python -m playwright install --with-deps chromium
      - name: Local server and browser interactions (no audio device)
        run: python scripts/browser_smoke.py --spawn --screenshot test-output/browser.png
      - run: python -m playwright install --with-deps webkit
      - name: Same browser flow in WebKit (Safari engine, for the Mac show machine)
        run: python scripts/browser_smoke.py --spawn --engine webkit --screenshot test-output/browser-webkit.png
      - name: Audit boundary and media-race browser regressions (guarded audio)
        run: python scripts/browser_audit_regressions.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-smoke
          path: test-output/
