[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spatialstage"
version = "0.4.1"
description = "Local-first four-channel theatre spatial audio Cue controller"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn>=0.28,<1",
  "python-multipart>=0.0.9,<1",
  "pydantic>=2.4,<3",
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "soundfile>=0.12,<1",
  "sounddevice>=0.4.7,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.9", "playwright>=1.50"]

[project.scripts]
spatialstage = "stagespatialcue.server:main"

[tool.setuptools.packages.find]
include = ["stagespatialcue*"]

[tool.setuptools.package-data]
stagespatialcue = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# Catch correctness errors without reformatting the entire prototype.
select = ["E9", "F63", "F7", "F82"]
